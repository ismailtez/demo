version: '3'

services:
  prometheus:
    image: prom/prometheus:v2.37.0
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:8.5.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "P@ssw0rd"  # Установите ваш пароль
    ports:
      - "3000:3000"
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.3.1
    container_name: node-exporter
    ports:
      - "9101:9100"  # Изменили порт, чтобы избежать конфликта (хост:порт контейнера)
    networks:
      - monitoring

  mktxp:
    image: ghcr.io/akpw/mktxp:latest
    container_name: mktxp
    volumes:
      - ./mktxp.conf:/home/mktxp/mktxp.conf:ro
    ports:
      - "49090:49090"
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge